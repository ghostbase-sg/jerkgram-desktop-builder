name: Linux source and profile preflight
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      retain_toolchain:
        description: Publish an already restored pinned toolchain (trusted local runner only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.retain_toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout builder
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source, profile and fixture CMake tests
        run: |
          python3 scripts/preflight.py --output reports
          python3 scripts/build_profile.py validate
          python3 -m unittest discover -s tests -v
      - name: Fetch pinned upstream and verify exact materialization
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/jerkgram-preflight-source"
          python3 scripts/builder.py prepare --source "$source_dir" --skip-submodules 2>&1 | tee reports/upstream-fetch.log
          python3 scripts/builder.py materialize --source "$source_dir" --skip-submodules | tee reports/materialization.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-preflight-${{ github.run_id }}
          path: reports/
          retention-days: 14
  toolchain-retention:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_toolchain && github.actor == 'ghostbase-sg' && github.repository == 'ghostbase-sg/jerkgram-desktop-builder' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/toolchain-publish.yml
